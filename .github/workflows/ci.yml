name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: JavaScript e testes da loja
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências de teste
        run: npm ci

      - name: Verificar sintaxe JavaScript
        run: npm run check

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Testar protótipo no navegador
        run: npm test

      - name: Salvar relatório dos testes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
